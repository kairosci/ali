name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Rust 1.100.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxi-dev libxcursor-dev

      - name: Install pinned Rust toolchain and components
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.100.0

      - name: Check formatting
        run: cargo +1.100.0 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings

      - name: Build CLI and native GUI
        run: cargo +1.100.0 build --locked --release

      - name: Validate required configuration catalogs
        run: cargo +1.100.0 run --locked -- adapters list
