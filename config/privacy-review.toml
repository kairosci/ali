descriptions = { en = "This passage contains personal identifiers such as a person's name, home address, date of birth, phone number, email, government ID, or details that identify an individual.", it = "Questo passaggio contiene identificativi personali come nome, indirizzo, data di nascita, telefono, email, documento pubblico o dettagli che identificano una persona.", fr = "Ce passage contient des identifiants personnels tels qu'un nom, une adresse, une date de naissance, un téléphone, un e-mail, une pièce d'identité ou des détails permettant d'identifier une personne.", es = "Este fragmento contiene identificadores personales como nombre, domicilio, fecha de nacimiento, teléfono, correo, documento oficial o detalles que identifican a alguien." }

